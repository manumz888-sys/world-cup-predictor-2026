version: "3.9"

services:
  wcp_db:
    image: postgres:15-alpine
    container_name: wcp_db
    environment:
      POSTGRES_USER: wcp_user
      POSTGRES_PASSWORD: wcp_password
      POSTGRES_DB: wcp_db
    ports:
      - "5432:5432"
    volumes:
      - wcp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcp_user -d wcp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  wcp_test_db:
    image: postgres:15-alpine
    container_name: wcp_test_db
    environment:
      POSTGRES_USER: wcp_user
      POSTGRES_PASSWORD: wcp_password
      POSTGRES_DB: wcp_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcp_user -d wcp_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wcp_db_data:
